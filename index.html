<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="UAD 3.6 field data capture for Pinewood Appraisal inspections. Everything stays on the device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3.6 Field">
<meta name="theme-color" content="#2F6B4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<style>
/* the pieces the Artifact host supplies for free, restated for the hosted copy */
:root{
  color-scheme: light dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Interior Field Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F5F7F5; --surface:#FFFFFF; --surface-2:#EDF1EE; --line:#D4DBD6; --line-strong:#B6C0B9;
  --ink:#171C19; --ink-2:#4B554E; --ink-3:#6E7A72;
  --pine:#2F6B4F; --pine-ink:#1F4A36; --pine-wash:#E4EFE8;
  --amber:#8A5A06; --amber-wash:#FBF0DC;
  --red:#A42A22; --red-wash:#FAE6E3;
  --focus:#2F6B4F;
  --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(23,28,25,.06), 0 1px 1px rgba(23,28,25,.04);
  --rail:258px;
  --ui:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Archivo", "Public Sans", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101412; --surface:#191F1B; --surface-2:#212A24; --line:#303A33; --line-strong:#44514A;
    --ink:#E9EFEA; --ink-2:#AFBCB4; --ink-3:#88968E;
    --pine:#6FB48F; --pine-ink:#A8D6BD; --pine-wash:#1B2E24;
    --amber:#E0A94F; --amber-wash:#2E2414;
    --red:#EE8E84; --red-wash:#301916;
    --focus:#6FB48F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#101412; --surface:#191F1B; --surface-2:#212A24; --line:#303A33; --line-strong:#44514A;
  --ink:#E9EFEA; --ink-2:#AFBCB4; --ink-3:#88968E;
  --pine:#6FB48F; --pine-ink:#A8D6BD; --pine-wash:#1B2E24;
  --amber:#E0A94F; --amber-wash:#2E2414;
  --red:#EE8E84; --red-wash:#301916;
  --focus:#6FB48F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
#app{display:flex; flex-direction:column; height:100%; min-height:0}

.topbar{
  display:flex; align-items:center; gap:12px;
  padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top, 0px));
  background:var(--surface); border-bottom:1px solid var(--line); flex:0 0 auto;
}
.brand{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.02em; white-space:nowrap}
.brand span{color:var(--pine)}
.jobline{flex:1 1 auto; min-width:0; font-size:13px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.saved{font-size:11.5px; color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums}
.topbtn{
  font:inherit; font-size:13.5px; font-weight:500; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
  padding:9px 15px; min-height:44px; cursor:pointer;
}
.topbtn:active{background:var(--line)}

.split{display:flex; flex:1 1 auto; min-height:0}
.rail{
  flex:0 0 var(--rail); width:var(--rail); overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--surface); border-right:1px solid var(--line); padding:12px 10px 24px;
}
.railhead{
  font-family:var(--display); font-size:11px; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); padding:10px 8px 8px;
}
.railhead:first-child{padding-top:4px}
.step{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  font:inherit; font-size:14.5px; color:var(--ink); background:none; border:0;
  border-radius:var(--r); padding:11px 10px; min-height:46px; cursor:pointer;
}
.step:active{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--pine-wash); color:var(--pine-ink); font-weight:600}
.step .n{flex:0 0 20px; font-family:var(--display); font-size:11.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums}
.step[aria-current="true"] .n{color:var(--pine-ink)}
.step .lbl{flex:1 1 auto}
.dot{flex:0 0 10px; width:10px; height:10px; border-radius:50%; background:var(--line-strong)}
.dot.ok{background:var(--pine)}
.dot.part{background:var(--amber)}
.dot.bad{background:var(--red)}

.pane{flex:1 1 auto; min-width:0; overflow-y:auto; -webkit-overflow-scrolling:touch}
.wrap{max-width:800px; padding:20px 16px 140px}

.strip{display:none}
@media (max-width: 900px){
  .rail{display:none}
  .strip{
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .strip::-webkit-scrollbar{display:none}
  .schip{
    display:flex; align-items:center; gap:7px; flex:0 0 auto;
    font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:999px; padding:8px 13px; min-height:40px; cursor:pointer;
  }
  .schip[aria-current="true"]{background:var(--pine-wash); border-color:var(--pine); color:var(--pine-ink); font-weight:600}
}

h1{font-family:var(--display); font-size:25px; font-weight:700; line-height:1.18; margin:0 0 4px; text-wrap:balance}
.sub{font-size:14px; color:var(--ink-2); margin:0 0 20px; max-width:62ch}
h2{
  font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); margin:26px 0 10px;
  padding-bottom:7px; border-bottom:1px solid var(--line);
}
h2:first-of-type{margin-top:4px}
.phase{
  font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--pine); margin:0 0 6px;
}

.f{margin:0 0 18px}
.flabel{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:7px}
.flabel .t{font-size:15.5px; font-weight:600; color:var(--ink)}
.fid{font-family:var(--display); font-size:11px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.req{font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 6px; border-radius:4px; background:var(--amber-wash); color:var(--amber)}
.req.opt{background:var(--surface-2); color:var(--ink-3); font-weight:600}
.hint{font-size:13px; color:var(--ink-2); margin:-2px 0 8px; max-width:62ch}

input[type=text], input[type=number], input[type=date], textarea, select{
  width:100%; font:inherit; font-size:16px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r);
  padding:11px 12px; min-height:46px; -webkit-appearance:none; appearance:none;
}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:96px; resize:vertical; line-height:1.5}
input:focus-visible, textarea:focus-visible, select:focus-visible,
button:focus-visible, .tile:focus-visible{outline:2.5px solid var(--focus); outline-offset:2px}

.row{display:flex; gap:10px; flex-wrap:wrap}
.row > .f{flex:1 1 150px; margin-bottom:0}
.narrow{max-width:200px}

.tiles{display:flex; flex-wrap:wrap; gap:8px}
.tile{
  font:inherit; font-size:15px; color:var(--ink); background:var(--surface);
  border:1.5px solid var(--line-strong); border-radius:var(--r);
  padding:10px 14px; min-height:46px; cursor:pointer; text-align:left;
}
.tile:active{background:var(--surface-2)}
.tile[aria-pressed="true"]{background:var(--pine-wash); border-color:var(--pine); color:var(--pine-ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--pine)}
.tile.rate{min-width:58px; text-align:center; font-family:var(--display); font-weight:600}
.tile.sm{font-size:14px; padding:10px 13px; min-height:44px}
.defs{margin-top:8px}
.defs summary{font-size:13px; color:var(--pine); cursor:pointer; list-style:none; padding:6px 0; min-height:34px; display:flex; align-items:center; gap:6px; width:fit-content}
.defs summary::-webkit-details-marker{display:none}
.defs.rest summary::before{content:"+"}
.defs.rest[open] summary::before{content:"\2212"}
.defs.rest .tiles{margin-top:6px}
.defs summary::before{content:"?"; display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%; border:1.5px solid var(--pine); font-size:12px; font-weight:700; font-family:var(--display)}
.defs[open] summary::before{content:"\00d7"}
.deflist{margin:4px 0 0; padding:12px 14px; background:var(--surface-2); border-radius:var(--r); border:1px solid var(--line); font-size:13.5px; line-height:1.5}
.deflist dt{font-weight:600; color:var(--ink); margin-top:9px}
.deflist dt:first-child{margin-top:0}
.deflist dd{margin:2px 0 0; color:var(--ink-2)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; margin:0 0 14px; box-shadow:var(--shadow)}
.card.flag{border-left:4px solid var(--red)}
.card.sub{box-shadow:none; background:var(--surface-2); border-style:dashed}
.cardhead{display:flex; align-items:center; gap:10px; margin:-2px 0 14px}
.cardtitle{font-family:var(--display); font-size:16px; font-weight:600; flex:1 1 auto; min-width:0}
.ghost{font:inherit; font-size:13.5px; color:var(--ink-2); background:none; border:1px solid var(--line-strong); border-radius:var(--r); padding:10px 13px; min-height:44px; cursor:pointer}
.ghost.danger{color:var(--red); border-color:var(--red)}
.add{font:inherit; font-size:15px; font-weight:600; color:var(--pine-ink); background:var(--pine-wash); border:1.5px dashed var(--pine); border-radius:var(--r); padding:13px 16px; min-height:50px; width:100%; cursor:pointer; font-family:var(--display)}
.empty{padding:22px 16px; text-align:center; color:var(--ink-3); font-size:14px; border:1px dashed var(--line-strong); border-radius:var(--r-lg); margin-bottom:14px}

.photos{display:flex; flex-wrap:wrap; gap:9px; margin-top:8px}
.ph{position:relative; width:94px; height:94px; border-radius:var(--r); overflow:hidden; background:var(--surface-2); border:1px solid var(--line)}
.ph img{width:100%; height:100%; object-fit:cover; display:block}
.ph button{position:absolute; top:3px; right:3px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(16,20,18,.72); color:#fff; font-size:15px; line-height:1; cursor:pointer}
/* Visually hidden but still laid out and hit-testable, which is what iOS
   needs in order to fire change on a file input. */
.vh{position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
.shoot:focus-within, .add:focus-within, .pickfile:focus-within{outline:2.5px solid var(--focus); outline-offset:2px}
.pickfile{width:58px; height:94px; border-radius:var(--r); border:1.5px dashed var(--line-strong);
  background:var(--surface); color:var(--ink-3); font:inherit; font-size:11px; cursor:pointer;
  display:grid; place-content:center; gap:3px; text-align:center; padding:4px; line-height:1.2}
.pickfile .ic{font-size:17px; line-height:1}
.saverow{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px}
.backup{font:inherit; font-family:var(--display); font-size:12.5px; font-weight:700;
  border-radius:999px; padding:8px 13px; min-height:44px; cursor:pointer; white-space:nowrap;
  border:1.5px solid transparent}
.backup.warn{background:var(--red-wash); color:var(--red); border-color:var(--red)}
.backup.ok{background:var(--pine-wash); color:var(--pine-ink); border-color:var(--pine)}
.busy{opacity:.55; pointer-events:none}
.shoot{width:94px; height:94px; border-radius:var(--r); border:1.5px dashed var(--line-strong); background:var(--surface); color:var(--ink-2); font:inherit; font-size:12px; cursor:pointer; display:grid; place-content:center; gap:3px; text-align:center; padding:4px}
.shoot .ic{font-size:21px; line-height:1}
.shoot.needed{border-color:var(--red); color:var(--red); background:var(--red-wash)}

.shotgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:14px}
.shot{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:11px; box-shadow:var(--shadow)}
.shot.need{border-color:var(--red); border-left:4px solid var(--red)}
.shot.done{border-left:4px solid var(--pine)}
.shotname{font-size:13.5px; font-weight:600; margin-bottom:7px; display:flex; align-items:center; gap:6px}
.shotname .dot{flex:0 0 8px; width:8px; height:8px}

.banner{display:flex; gap:11px; padding:13px 15px; border-radius:var(--r-lg); margin:0 0 18px; font-size:14px; line-height:1.45; border:1px solid}
.banner .bi{flex:0 0 auto; font-family:var(--display); font-weight:700; font-size:13px}
.banner.warn{background:var(--amber-wash); border-color:var(--amber); color:var(--amber)}
.banner.stop{background:var(--red-wash); border-color:var(--red); color:var(--red)}
.banner.info{background:var(--pine-wash); border-color:var(--pine); color:var(--pine-ink)}
.banner b{font-weight:700}

.stepper{display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden; width:fit-content; background:var(--surface)}
.stepper button{width:48px; height:46px; border:0; background:var(--surface); color:var(--ink); font-size:21px; line-height:1; cursor:pointer; font-family:var(--display)}
.stepper button:active{background:var(--surface-2)}
.stepper .v{min-width:50px; text-align:center; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; border-left:1px solid var(--line); border-right:1px solid var(--line); height:46px; display:grid; place-items:center}

.orderrow{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line)}
.orderrow:last-of-type{border-bottom:0}
.orderrow .on{flex:0 0 22px; font-family:var(--display); font-size:12px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums}
.orderrow .ov{flex:1 1 auto; font-size:15px}
.orderrow .ghost{min-height:36px; padding:5px 10px}
.quick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px}
.quick button{font:inherit; font-size:13px; font-family:var(--display); font-weight:600; color:var(--pine-ink);
  background:var(--pine-wash); border:1px solid var(--pine); border-radius:999px;
  padding:6px 12px; min-height:36px; cursor:pointer}
.roomlist{display:flex; flex-direction:column; gap:9px; margin-bottom:14px}
.roomcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:13px 15px; cursor:pointer; box-shadow:var(--shadow)}
.roomcard.cold{border-left:4px solid var(--line-strong)}
.roomcard.part{border-left:4px solid var(--amber)}
.roomcard.need{border-left:4px solid var(--amber)}
.roomcard.bad{border-left:4px solid var(--red)}
.roomcard.done{border-left:4px solid var(--pine)}
.roomcard .ra{flex:1 1 auto; min-width:0}
.roomcard .rt{font-weight:600; font-size:15.5px}
.roomcard .rm{font-size:12.5px; color:var(--ink-3); margin-top:1px}
.roomcard .rc{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.lvlhead{font-family:var(--display); font-size:13px; font-weight:600; color:var(--ink-2); margin:16px 0 8px; display:flex; gap:8px; align-items:baseline}
.lvlhead .lm{font-size:11.5px; color:var(--ink-3); font-weight:500}

.skbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px}
.skwrap{overflow:auto; -webkit-overflow-scrolling:touch; max-height:66vh; border:1px solid var(--line-strong); border-radius:var(--r-lg); background:#fff; margin-bottom:14px}
.skinner{position:relative; width:100%; min-width:100%}
.skimg{display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none}
.skimg.abs{position:absolute; max-width:none}
.skclip{position:relative; width:100%; height:0; overflow:hidden}
.cropstage{touch-action:none; cursor:crosshair}
.cropsel{position:absolute; border:2px solid #2F6B4F; background:rgba(47,107,79,.16); box-shadow:0 0 0 9999px rgba(16,20,18,.34); pointer-events:none}
.pin{
  position:absolute; transform:translate(-50%,-50%); font:inherit; font-size:12.5px; font-weight:600;
  font-family:var(--display); white-space:nowrap; padding:5px 9px; border-radius:999px; cursor:pointer;
  border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4); color:#fff; background:#8A5A06; z-index:2;
}
.pin.pending{background:#1F4A36; animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.18)}}
@media (prefers-reduced-motion: reduce){.pin.pending{animation:none}}
.pin.cold{background:#6E7A72}
.pin.part{background:#8A5A06}
.pin.done{background:#2F6B4F}
.pin.bad{background:#A42A22}
.pin.arrange{cursor:grab; outline:2px dashed #fff; outline-offset:2px}
.pin .pc{display:inline-block; margin-left:5px; opacity:.85; font-weight:500}
.skhint{font-size:13px; color:var(--ink-2); margin:0 0 10px}
.zoomer{display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.zoomer button{width:44px; height:40px; border:0; background:var(--surface); color:var(--ink); font-size:17px; cursor:pointer; font-family:var(--display)}
.zoomer .zv{min-width:56px; text-align:center; font-size:13px; font-variant-numeric:tabular-nums; border-left:1px solid var(--line); border-right:1px solid var(--line); height:40px; display:grid; place-items:center}
.pagetabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px}
.rev{border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--surface); margin-bottom:18px}
.revrow{display:flex; gap:12px; padding:12px 15px; border-bottom:1px solid var(--line); font-size:14.5px; align-items:center}
.revrow:last-child{border-bottom:0}
.revrow .rl{flex:1 1 auto}
.revrow .rv{color:var(--ink-2); font-variant-numeric:tabular-nums; text-align:right}
.revrow.tapfix{width:100%; font:inherit; font-size:14.5px; text-align:left; border:0;
  border-bottom:1px solid var(--line); cursor:pointer; min-height:48px}
.revrow.tapfix:active{filter:brightness(.96)}
@keyframes findme{
  0%,100%{box-shadow:0 0 0 0 rgba(47,107,79,0)}
  20%,60%{box-shadow:0 0 0 4px rgba(47,107,79,.38)}
}
.f.findme{border-radius:var(--r); animation:findme 2.2s ease-in-out 1}
@media (prefers-reduced-motion: reduce){
  .f.findme{animation:none; box-shadow:0 0 0 4px rgba(47,107,79,.38)}
}
.revrow .goarrow{flex:0 0 auto; font-size:19px; color:var(--ink-3); line-height:1; padding-left:4px}
.revrow.miss{background:var(--amber-wash)}
.revrow.missred{background:var(--red-wash)}
.derived{font-size:12.5px; color:var(--pine); font-weight:600; font-family:var(--display); letter-spacing:.03em}
.big{font:inherit; font-family:var(--display); font-size:17px; font-weight:700; color:#fff; background:var(--pine); border:0; border-radius:var(--r-lg); padding:16px 20px; width:100%; min-height:58px; cursor:pointer}
.big:active{background:var(--pine-ink)}
.big.sec{background:var(--surface); color:var(--ink); border:1.5px solid var(--line-strong)}
pre.out{white-space:pre-wrap; word-break:break-word; font-size:11.5px; line-height:1.45; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:12px; max-height:280px; overflow:auto; margin:12px 0 0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace}

.botbar{
  position:sticky; bottom:0; flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));

function openDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(k){
  return new Promise(function(res, rej){
    var t = db.transaction(STORE,"readonly").objectStore(STORE).get(k);
    t.onsuccess = function(){ res(t.result); }; t.onerror = function(){ rej(t.error); };
  });
}
function idbPut(k, v){
  return new Promise(function(res, rej){
    var t = db.transaction(STORE,"readwrite").objectStore(STORE).put(v, k);
    t.onsuccess = function(){ res(); }; t.onerror = function(){ rej(t.error); };
  });
}
function idbDel(k){
  return new Promise(function(res, rej){
    var t = db.transaction(STORE,"readwrite").objectStore(STORE).delete(k);
    t.onsuccess = function(){ res(); }; t.onerror = function(){ rej(t.error); };
  });
}

var photoURLs = {};

function storePhoto(file, cap, tie){
  return downscale(file).then(function(blob){
    var id = uid();
    return idbPut("photo:"+id, blob).then(function(){
      J.photos.push({ id:id, cap:cap||"", tie:tie||"", onDevice:false });
      photoURLs[id] = URL.createObjectURL(blob);
      save();
      return id;
    });
  });
}
function downscale(file){
  return new Promise(function(res){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var MAX = 1600, w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, MAX / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w*s); c.height = Math.round(h*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        if(c.toBlob) c.toBlob(function(b){ res(b || file); }, "image/jpeg", 0.78);
        else res(file);
      };
      img.onerror = function(){ res(file); };
      img.src = fr.result;
    };
    fr.onerror = function(){ res(file); };
    fr.readAsDataURL(file);
  });
}
function photoURL(id){
  if(photoURLs[id]) return Promise.resolve(photoURLs[id]);
  return idbGet("photo:"+id).then(function(b){
    if(!b) return "";
    photoURLs[id] = URL.createObjectURL(b);
    return photoURLs[id];
  });
}
function unsavedPhotos(){

}
/* Deleting a room, a defect or an outbuilding used to delete its photos with
   it.  A report can be rebuilt and a photo cannot, so now they are detached
   into an unfiled pool instead, and can be put back on any room. */
function detachPhotos(tie, label){
  var moved = 0;
  J.photos.forEach(function(p2){
    if(p2.tie === tie){
      p2.tie = "orphan";
      p2.cap = (p2.cap || "photo") + (label ? "  \u2014 was " + label : "");
      moved++;
    }
  });
  if(moved) save();
  return moved;
}
function orphanPhotos(){ return J.photos.filter(function(p2){ return p2.tie === "orphan"; }); }
function unbackedIn(tie){
  return J.photos.filter(function(p2){ return p2.tie === tie && !p2.onDevice; }).length;
}

function photosFor(tie){ return J.photos.filter(function(p){ return p.tie === tie; }); }
function deletePhoto(id){
  J.photos = J.photos.filter(function(p){ return p.id !== id; });
  if(photoURLs[id]){ URL.revokeObjectURL(photoURLs[id]); delete photoURLs[id]; }
  idbDel("photo:"+id); save();
}

function photoBlock(parent, tie, cap, required, label){
  var box = el("div","photos");
  photosFor(tie).forEach(function(p){

  });
  var n = photosFor(tie).length;

  /* A label wrapping the input: the tap reaches the input natively.  iOS does
     not reliably fire change on a display:none input driven by .click().
     Two of them: the camera is the default, and a narrower one beside it
     offers the camera roll and Files, because capture="environment" hides
     the library on iOS. */
  function picker(cls, iconChar, caption, useCamera){
    var lab = document.createElement("label");
    lab.className = cls;
    lab.appendChild(el("div","ic", iconChar));
    var capEl = el("div", null, caption);
    lab.appendChild(capEl);
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
    if(useCamera) inp.setAttribute("capture","environment");
    inp.className = "vh";
    inp.onchange = function(){
      var files = Array.prototype.slice.call(inp.files || []);
      if(!files.length) return;
      lab.classList.add("busy");
      capEl.textContent = "Saving…";
      var chain = Promise.resolve();
      files.forEach(function(f){ chain = chain.then(function(){ return storePhoto(f, cap, tie); }); });
      chain.then(function(){ inp.value = ""; render(); })
        .catch(function(err){
          console.error(err);
          lab.classList.remove("busy");
          capEl.textContent = caption;
          toast("Could not save that photo.  " + ((err && err.message) || ""));
        });
    };
    lab.appendChild(inp);
    return lab;
  }

  box.appendChild(picker("shoot" + (required && n === 0 ? " needed" : ""),
    "▣", label || (required && n === 0 ? "Required" : "Camera"), true));
  box.appendChild(picker("pickfile", "☰", "Files", false));

  parent.appendChild(box);

  /* iOS never puts a photo taken through a web page into the camera roll, so
     this hands them to the share sheet where Save Image does it. */
  var un2 = photosFor(tie).filter(function(p2){ return !p2.onDevice; });
  if(n && canSharePhotos()){

      : "All " + n + " already on the iPad");
    sv.type = "button";
    sv.disabled = !un2.length;
    if(un2.length) sv.style.cssText = "border-color:var(--red);color:var(--red);font-weight:600";
    sv.onclick = function(){ sharePhotos(un2, sv); };
    row.appendChild(sv);
    parent.appendChild(row);
  }
}

/* Two ways off the app, and they are not the same thing.
   Photos  -> the share sheet, Save Images, lands in the camera roll.  Needs https.
   Files   -> an ordinary download of a zip, lands in the Files app, and from
              there he can drop it straight into OneDrive.  Works over http. */
function savePhotosToFiles(btn){
  var list = J.photos.slice();
  if(!list.length){ toast("No photos yet."); return; }
  var label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Packing " + list.length + " photos…"; }
  var enc = new TextEncoder();
  var index = ["PHOTOS — " + (J.meta.address || "inspection"),
               "Inspected " + (J.meta.inspDate || ""), ""];
  var entries = [];
  var chain = Promise.resolve();
  list.forEach(function(p2, i){
    chain = chain.then(function(){
      return idbGet("photo:"+p2.id).then(function(b){
        if(!b) return;
        var nm = String(i+1).padStart(3,"0") + "-"
          + (p2.cap ? p2.cap.replace(/[^a-z0-9]+/gi,"-").toLowerCase() : "photo") + ".jpg";
        index.push(nm + "   " + (p2.cap || "") + "   [" + p2.tie + "]");
        return b.arrayBuffer().then(function(ab){
          entries.push({ name:nm, data:new Uint8Array(ab) });
        });
      });
    });
  });
  chain.then(function(){
    entries.unshift({ name:"PHOTO INDEX.txt", data:enc.encode(index.join("\n")) });
    var zip = makeZip(entries);
    var fname = slug(J.meta.address) + "-photos-" + (J.meta.inspDate || todayISO()) + ".zip";
    if(btn){ btn.disabled = false; btn.textContent = label; }
    var file = null;
    try{ file = new File([zip], fname, { type:"application/zip" }); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
      navigator.share({ files:[file], title:fname }).then(markAllOnDevice).catch(function(e){
        if(e && e.name === "AbortError") return;
        fallbackSave(zip, fname); markAllOnDevice();
      });
      return;
    }
    fallbackSave(zip, fname);
    markAllOnDevice();
  }).catch(function(err){
    console.error(err);
    if(btn){ btn.disabled = false; btn.textContent = label; }
    toast("Could not pack the photos.  " + ((err && err.message) || ""));
  });
}
function markAllOnDevice(){
  J.photos.forEach(function(p2){ p2.onDevice = true; });
  save(); render();
}

/* ---- getting photos off the app and into the iPad's own Photos app ---- */
function canSharePhotos(){
  try{
    return !!(navigator.canShare && navigator.share &&
      navigator.canShare({ files:[new File([new Blob(["x"])],"t.jpg",{type:"image/jpeg"})] }));
  }catch(e){ return false; }
}
function sharePhotos(list, btn){
  if(!list.length) return;
  var label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Getting them ready…"; }
  var files = [];
  var chain = Promise.resolve();
  list.forEach(function(p2, i){
    chain = chain.then(function(){
      return idbGet("photo:"+p2.id).then(function(b){
        if(!b) return;
        var nm = (p2.cap ? p2.cap.replace(/[^a-z0-9]+/gi,"-").toLowerCase() : "photo")
          + "-" + (i+1) + ".jpg";
        files.push(new File([b], nm, { type:"image/jpeg" }));
      });
    });
  });
  chain.then(function(){
    if(btn){ btn.disabled = false; btn.textContent = label; }
    if(!files.length) return;
    return navigator.share({ files:files, title:"Inspection photos" }).then(function(){
      list.forEach(function(p2){ p2.onDevice = true; });
      save(); render();
      toast("Handed to the share sheet.  They are only in Photos if you chose Save Images.");
    });
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = label; }
    if(err && err.name === "AbortError") return;
    console.error(err);
    toast("Could not hand those to the share sheet.  " + ((err && err.message) || ""));
  });
}

function allRooms(){
  var out = [];
  J.levels.forEach(function(L){
    L.rooms.forEach(function(R){ out.push({ L:L, R:R }); });
  });
  return out;
}
function roomName(R, L){
  var base = R.label || R.type || "Room";
  var sameType = L ? L.rooms.filter(function(x){ return x.type === R.type; }) : [];
  if(!R.label && sameType.length > 1){
    base = R.type + " " + (sameType.indexOf(R) + 1);
  }
  return base;
}
function kbRooms(){
  return allRooms().filter(function(x){ return E.kbTypes.indexOf(x.R.type) >= 0; });
}
function derivedFlooring(){
  var map = {};
  allRooms().forEach(function(x){
    x.R.flooring.forEach(function(t){
      if(!map[t]) map[t] = { type:t, rooms:[], worst:"" };
      map[t].rooms.push(roomName(x.R, x.L));
      if(x.R.cond && worse(x.R.cond, map[t].worst)) map[t].worst = x.R.cond;
    });
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function worse(a, b){
  if(!b) return true;
  return E.condStatus.indexOf(a) > E.condStatus.indexOf(b);
}
function derivedCeilingHeights(){
  var s = [];
  allRooms().forEach(function(x){
    if(x.R.ceilingHeight && s.indexOf(x.R.ceilingHeight) < 0) s.push(x.R.ceilingHeight);
  });
  return E.ceilingHeight.filter(function(h){ return s.indexOf(h) >= 0; });
}
function derivedCeilingStyles(){
  var s = [];
  allRooms().forEach(function(x){
    x.R.ceilingStyles.forEach(function(c){ if(s.indexOf(c) < 0) s.push(c); });
  });
  return E.ceilingStyle.filter(function(c){ return s.indexOf(c) >= 0; });
}
function finalCeilingHeights(){
  return J.rollup.ceilingHeights ? J.rollup.ceilingHeights : derivedCeilingHeights();
}
function finalCeilingStyles(){
  return J.rollup.ceilingStyles ? J.rollup.ceilingStyles : derivedCeilingStyles();
}
function suggestBathOverall(){
  var baths = kbRooms().filter(function(x){ return x.R.type !== "Kitchen"; });
  if(!baths.length) return "";
  var st = baths.map(function(x){ return x.R.update; }).filter(has);
  if(st.length < baths.length) return "";
  var full = st.filter(function(s){ return s === "Fully Updated"; }).length;
  var part = st.filter(function(s){ return s === "Partially Updated"; }).length;
  var none = st.filter(function(s){ return s === "Not Updated"; }).length;
  if(full === st.length) return "Fully Updated";
  if(none === st.length) return "Not Updated";
  if(full > 0 && full + part >= st.length) return "Significantly Updated";
  if(part === st.length) return "Moderately Updated";
  if(full + part > none) return "Significantly Updated";
  return "Moderately Updated";
}
function roomCounts(){
  var o = {bed:0, full:0, half:0, kitchens:0};
  allRooms().forEach(function(x){
    if(x.R.type === "Bedroom") o.bed++;
    else if(x.R.type === "Bath – Full") o.full++;
    else if(x.R.type === "Bath – Half") o.half++;
    else if(x.R.type === "Kitchen") o.kitchens++;
  });
  return o;
}
function allDefects(){
  var out = [];
  allRooms().forEach(function(x){
    x.R.defects.forEach(function(D){ out.push({ L:x.L, R:x.R, D:D }); });
  });
  return out;
}
function defectLocationFor(R, L){
  if(R.type === "Bath – Full") return { loc:"Full Bathroom", other:"" };
  if(R.type === "Bath – Half") return { loc:"Half Bathroom", other:"" };
  if(R.type === "Kitchen")          return { loc:"Kitchen", other:"" };
  return { loc:"Other (Describe)", other:roomName(R, L) };
}
function subjectTo(){
  var inside = allDefects().some(function(x){
    return x.D.action === "Repair" || x.D.action === "Inspection" || x.D.action === "Completion";
  });
  var others = [];
  J.outbuildings.forEach(function(O){ others = others.concat(O.defects); });
  others = others.concat(J.vehicle.defects, J.amenityDefects);
  var elsewhere = others.some(function(D){
    return D.action === "Repair" || D.action === "Inspection" || D.action === "Completion";
  });
  var siteSub = J.site.defects.some(function(D){
    return D.action === "Repair" || D.action === "Inspection" || D.action === "Completion";
  });
  return inside || extDefectsSubjectTo() || elsewhere || siteSub;
}
function shotList(){
  return SHOTS.concat(J.meta.fha === "Yes" ? FHA_SHOTS : []);
}

function boardIx(){ return SCREENS.map(function(S){ return S.key; }).indexOf("board"); }
function st(n, total, hard){
  if(hard) return { cls:"bad", txt:n + " of " + total };
  if(total === 0) return { cls:"", txt:"nothing yet" };
  if(n >= total) return { cls:"ok", txt:"done" };
  if(n === 0) return { cls:"", txt:"not started" };
  return { cls:"part", txt:n + " of " + total };
}

/* ---- inspection identity ---- */
function drawStart(w){
  w.appendChild(el("div","phase","Before you start"));
  w.appendChild(el("h1", null, "Inspection"));
  w.appendChild(el("p","sub","Set the loan type first.  FHA adds the crawl space and attic to the required shot list, and the app will hold them against you until they are taken."));

  var f = field(w, {label:"Subject address", req:"REQUIRED"});
  textIn(f, function(){ return J.meta.address; }, function(v){ J.meta.address = v; });

  var row = el("div","row"); w.appendChild(row);
  f = field(row, {label:"Inspection date", req:"REQUIRED"});
  textIn(f, function(){ return J.meta.inspDate; }, function(v){ J.meta.inspDate = v; }, "", "date");
  f = field(row, {label:"Client", req:"optional"});
  textIn(f, function(){ return J.meta.client; }, function(v){ J.meta.client = v; });

  f = field(w, {label:"Is this an FHA assignment", req:"REQUIRED",
    hint:"Yes adds the crawl space and attic photos to Phase 6."});
  yesNo(f, function(){ return J.meta.fha; }, function(v){ J.meta.fha = v; });

  f = field(w, {label:"Occupancy", id:"10.020", req:"REQUIRED",
    hint:"As of the inspection date.  If it is occupied, the route works around whoever is home."});
  tilesOne(f, E.occupancy, function(){ return J.meta.occupancy; }, function(v){ J.meta.occupancy = v; });

  f = field(w, {label:"Accessory dwelling units on the property", id:"3.006", req:"REQUIRED",
    hint:"Nearly always zero.  One or more turns on a whole extra Unit Interior, its own measurements, and the ADU questions."});
  var adub = el("div"); f.appendChild(adub);
  stepper(adub, function(){ return num(J.meta.adus); }, function(n){ J.meta.adus = String(n); });

  f = field(w, {label:"Unit identifier", id:"10.002", req:"Required if more than one unit",
    hint:"Leave blank on a plain single-family house.  Examples: Primary Dwelling, ADU, Unit 1."});
  textIn(f, function(){ return J.meta.unitId; }, function(v){ J.meta.unitId = v; }, "blank for a single unit");
}
function stStart(){
  var n = 0;
  if(has(J.meta.address)) n++;
  if(has(J.meta.inspDate)) n++;
  if(has(J.meta.fha)) n++;
  if(has(J.meta.occupancy)) n++;
  return st(n, 4);
}

/* Two places the form takes free text rather than a closed list: the window
   description at 8.037, and the surface of the walls, which Section 10 has no
   enumeration for at all.  Quick chips append a word so it is still one tap. */
function quickWords(parent, words, get, set){
  var box = el("div","quick");
  words.forEach(function(wd){
    var b = el("button", null, wd); b.type = "button";
    b.onclick = function(){
      var cur = get() || "";
      set(cur ? (cur.replace(/[\s,]+$/,"") + ", " + wd) : wd);
      save(); render();
    };
    box.appendChild(b);
  });
  parent.appendChild(box);
}

function drawLists(w){
  w.appendChild(el("div","phase","This iPad"));
  w.appendChild(el("h1", null, "Answer order"));
  w.appendChild(el("p","sub","Every 3.6 list is closed, so nothing can be added to it, but the order is yours.  What is in the top row shows first everywhere in the app; everything else sits one tap down.  This follows the iPad, not the file."));

  tunableLists().forEach(function(T){
    var front = commonFor(T.key).filter(function(v){ return T.list.indexOf(v) >= 0; });
    var rest = T.list.filter(function(v){ return front.indexOf(v) < 0; });

    var c = el("div","card");
    var h = el("div","cardhead");
    h.appendChild(el("div","cardtitle", T.label));
    if(T.key === "windowCombo") h.appendChild(el("div","fid","FREE TEXT, NOT A UAD LIST"));
    if(PREFS.common[T.key]){
      var rs = el("button","ghost","Reset"); rs.type = "button";
      rs.onclick = function(){ delete PREFS.common[T.key]; savePrefs(); render(); };
      h.appendChild(rs);
    }
    c.appendChild(h);

    if(!front.length) c.appendChild(el("div","hint","Nothing pinned, so the whole list shows in its own order."));
    front.forEach(function(v, ix){
      var row = el("div","orderrow");
      row.appendChild(el("div","on", String(ix+1)));
      row.appendChild(el("div","ov", v));
      var up = el("button","ghost","↑"); up.type = "button";
      up.disabled = ix === 0;
      up.onclick = function(){
        var a = front.slice();
        a.splice(ix-1, 0, a.splice(ix,1)[0]);
        PREFS.common[T.key] = a; savePrefs(); render();
      };
      var dn = el("button","ghost","↓"); dn.type = "button";
      dn.disabled = ix === front.length - 1;
      dn.onclick = function(){
        var a = front.slice();
        a.splice(ix+1, 0, a.splice(ix,1)[0]);
        PREFS.common[T.key] = a; savePrefs(); render();
      };
      var rm = el("button","ghost danger","Unpin"); rm.type = "button";
      rm.onclick = function(){
        PREFS.common[T.key] = front.filter(function(x){ return x !== v; });
        savePrefs(); render();
      };
      row.appendChild(up); row.appendChild(dn); row.appendChild(rm);
      c.appendChild(row);
    });

    if(rest.length){
      c.appendChild(el("div","hint","Tap to pin one to the top row."));
      var box = el("div","tiles");
      rest.forEach(function(v){
        var b = el("button","tile sm","+ " + v); b.type = "button";
        b.onclick = function(){
          PREFS.common[T.key] = front.concat([v]);
          savePrefs(); render();
        };
        box.appendChild(b);
      });
      c.appendChild(box);
    }

    w.appendChild(c);
  });

  w.appendChild(el("h2", null, "Start over"));
  var all = el("button","big sec","Put every list back the way it shipped"); all.type = "button";
  all.onclick = function(){
    if(!confirm("Reset the order of every list on this iPad?")) return;
    PREFS.common = {}; savePrefs(); render();
  };
  w.appendChild(all);
}

function stLists(){
  var n = Object.keys(PREFS.common).length;
  return { cls:"", txt: n ? n + " changed" : "as shipped" };
}

  w.appendChild(el("div","phase","Phase 1" + (J.meta.fha === "Yes" ? " and Phase 6" : "")));
  w.appendChild(el("h1", null, "Exterior photographs"));
  w.appendChild(el("p","sub","Street both directions first, then all four sides of the house.  Red means the shot has not been taken."));

  var list = shotList(), missing = list.filter(function(s){ return !s.opt && photosFor("shot:"+s.key).length === 0; });
  if(missing.length){
    var b = el("div","banner warn");
    b.appendChild(el("div","bi","!"));
    b.appendChild(el("div", null, missing.length + " required shot" + (missing.length===1?"":"s") + " still to take."));
    w.appendChild(b);
  }

  var grid = el("div","shotgrid");
  list.forEach(function(s){
    var n = photosFor("shot:"+s.key).length;
    var c = el("div","shot " + (n ? "done" : (s.opt ? "" : "need")));
    var nm = el("div","shotname");
    nm.appendChild(el("span","dot " + (n ? "ok" : (s.opt ? "" : "bad"))));
    nm.appendChild(el("span", null, s.name));

    photoBlock(c, "shot:"+s.key, s.name, !s.opt, n ? "Another" : (s.opt ? "Add" : "Required"));
    grid.appendChild(c);
  });

  w.appendChild(el("h2", null, "Anything else outside"));

    hint:"Street scene detail, outbuilding approach, a neighboring influence, whatever the file needs."});
  photoBlock(f, "shot:extra", "Exterior", false, "Add photo");
}
function stExt(){
  var list = shotList().filter(function(s){ return !s.opt; });
  var done = list.filter(function(s){ return photosFor("shot:"+s.key).length > 0; }).length;
  return st(done, list.length, done < list.length && done > 0 ? false : false);
}

function stExtData(){
  var X = J.ext, n = 0, tot = 10, fha = J.meta.fha === "Yes";
  if(has(X["8.004"])) n++;
  if(has(X["8.010"]) && has(X["8.010_est"])) n++;
  if(X["8.011"].length) n++;
  if(has(X["8.005"])) n++;
  if(X.walls.mat.length && has(X.walls.cond)) n++;
  if(X.foundation.mat.length && X.foundation.type.length && has(X.foundation.cond)) n++;
  if(X.roof.mat.length && has(X.roof.age) && has(X.roof.observable)
     && (X.roof.observable === "No" || has(X.roof.cond))) n++;
  if(has(X.windows.desc) && has(X.windows.cond)) n++;
  var heatOK = X.heat.types.length > 0 && (X.heat.types.indexOf("None") >= 0
    ? has(X.heat.lackTypical)
    : X.heat.types.every(function(t){ return has(X.heat.fuel[t]); }) && has(X["8.052"]));
  if(heatOK && has(X.cool.exists)) n++;
  if(has(X["8.022"]) && has(X["8.023"])) n++;
  if(fha){
    tot += 1;
    if(has(X.atticExists) && has(X["8.018"]) && has(X["8.019"])) n++;
  }
  var bad = X.defects.some(function(D){ return photosFor("extdef:"+D.id).length === 0; });
  var s2 = st(n, tot);
  if(bad) s2.cls = "bad";
  return s2;
}

function extDefectsSubjectTo(){
  return J.ext.defects.some(function(D){
    return D.action === "Repair" || D.action === "Inspection" || D.action === "Completion";
  });
}

function stSite(){
  var S4 = J.site, n = 0, tot = 7;
  if(has(S4["4.020"])) n++;
  if(has(S4["4.024"])) n++;
  if(S4["4.025"].length) n++;
  if(S4.views.length && S4.views.every(function(v){
    var d = S4.viewDetail[v] || {};
    return has(d.range) && has(d.impact);
  })) n++;
  if(S4["4.062"].length) n++;
  if(S4.utilities.length && S4.utilities.every(function(u){ return has((S4.util[u]||{}).own); })) n++;
  if(has(S4["4.017"]) && has(S4.water) && S4["4.047"].length) n++;
  var bad = S4.defects.some(function(D){ return photosFor("sitedef:"+D.id).length === 0; });
  var s2 = st(n, tot);
  if(bad) s2.cls = "bad";
  return s2;
}

function drawLevelCard(w, L, i){
  var c = el("div","card");
  var h = el("div","cardhead");
  h.appendChild(el("div","cardtitle", L.name || ("Level " + (i+1))));
  var del = el("button","ghost danger","Remove"); del.type = "button";
  del.onclick = function(){
    if(L.rooms.length && !confirm("Remove " + (L.name||"this level") + " and its " + L.rooms.length + " rooms?")) return;
    L.rooms.forEach(function(R){
      var nm5 = roomName(R, L);
      detachPhotos("room:"+R.id, nm5);
      R.defects.forEach(function(D){ detachPhotos("def:"+D.id, nm5 + " defect"); });
    });
    J.levels.splice(i,1); save(); render();
  };
  h.appendChild(del); c.appendChild(h);

  var f = field(c, {label:"Level name", id:"10.029", req:"REQUIRED", hint:"Level 1, Level 2, Level B1."});
  var nb = el("div","narrow"); f.appendChild(nb);
  textIn(nb, function(){ return L.name; }, function(v){ L.name = v; });

  f = field(c, {label:"Grade level type", id:"10.030", req:"REQUIRED"});
  tilesOne(f, E.gradeType, function(){ return L.grade; }, function(v){ L.grade = v; }, null, true);
  if(L.grade === "Fully Below Grade" || L.grade === "Partially Below Grade"){
    f = field(c, {label:"Below grade access", id:"10.030", req:"REQUIRED"});
    tilesOne(f, E.belowAccess, function(){ return L.access; }, function(v){ L.access = v; }, null, true);
  }

  var r = el("div","row"); c.appendChild(r);
  f = field(r, {label:"Finished area of level", id:"10.031", req:"REQUIRED"});
  textIn(f, function(){ return L.fin; }, function(v){ L.fin = v; }, "sf", "number");
  f = field(r, {label:"Unfinished area of level", id:"10.032", req:"REQUIRED", hint:"0 if none."});
  textIn(f, function(){ return L.unfin; }, function(v){ L.unfin = v; }, "sf", "number");

  w.appendChild(c);
}
function sumLvl(where, what){
  var t = 0;
  J.levels.forEach(function(L){
    var below = /^\s*level\s*b/i.test(L.name || "") || L.grade === "Fully Below Grade";
    if((where === "below") === !!below) t += num(what === "fin" ? L.fin : L.unfin);
  });
  return t.toLocaleString();
}
function stSketch(){
  var n = 0, tot = 8;
  if(J.sketch.done === true) n++;
  ["10.003","10.004","10.005","10.007","10.008"].forEach(function(k){ if(has(J.sketch[k])) n++; });
  if(J.sketch["10.009"].length) n++;
  var lvOK = J.levels.length > 0 && J.levels.every(function(L){
    return has(L.name) && has(L.grade) && has(L.fin) && has(L.unfin)
      && (L.grade === "Above Grade" || has(L.access));
  });
  if(lvOK) n++;
  return st(n, tot);
}

  h.appendChild(del); c.appendChild(h);

  var f = field(c, {label:"Feature", id:ids.feature, req:"REQUIRED"});

    hint:"What you saw, in plain words.  Say what it appears to indicate rather than naming a cause."});
  memo(f, function(){ return D.desc; }, function(v){ D.desc = v; }, "Describe the defect");

/* A sketch page from TOTAL carries a title block, the drawing, and an area
   summary.  The app keeps the whole image and stores a crop box over it, so
   nothing is thrown away and one page can be cropped twice when two levels are
   drawn on it.  sketchBox suggests a starting box by finding what is inked. */
function fullCrop(){ return { x:0, y:0, w:1, h:1 }; }

function sketchBox(file){
  return new Promise(function(res){
    var fr = new FileReader();
    fr.onerror = function(){ res(null); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ res(null); };
      img.onload = function(){
        var natW = img.naturalWidth, natH = img.naturalHeight;
        try{
          var SW = 500;
          var sc = Math.min(1, SW / Math.max(natW, natH));
          var w = Math.max(1, Math.round(natW * sc)), h = Math.max(1, Math.round(natH * sc));
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          var ctx = c.getContext("2d", { willReadFrequently:true });
          ctx.drawImage(img, 0, 0, w, h);
          var d = ctx.getImageData(0, 0, w, h).data;
          var INK = 225, minX = w, minY = h, maxX = -1, maxY = -1, x, y, i;
          for(y = 0; y < h; y++){
            for(x = 0; x < w; x++){
              i = (y * w + x) * 4;
              if(d[i] < INK || d[i+1] < INK || d[i+2] < INK){
                if(x < minX) minX = x;
                if(x > maxX) maxX = x;
                if(y < minY) minY = y;
                if(y > maxY) maxY = y;
              }
            }
          }
          if(maxX < 0){ res({ natW:natW, natH:natH, crop:fullCrop() }); return; }
          var pad = 0.01;
          res({ natW:natW, natH:natH, crop:{
            x: Math.max(0, minX / w - pad),
            y: Math.max(0, minY / h - pad),
            w: Math.min(1, (maxX - minX + 1) / w + pad*2),
            h: Math.min(1, (maxY - minY + 1) / h + pad*2)
          }});
        }catch(e){ res({ natW:natW, natH:natH, crop:fullCrop() }); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Sketch pages skip the 1600px downscale the inspection photos get; a sketch
   has to stay readable when it is zoomed in on. */
function storeSketch(file){
  if(!/^image\//.test(file.type || "")){
    return Promise.reject(new Error("that file is not an image (" + (file.type || "unknown type") + ")"));
  }
  return sketchBox(file).then(function(info){
    var id = uid();
    return idbPut("photo:"+id, file).then(function(){
      J.photos.push({ id:id, cap:"Building sketch", tie:"sketch", onDevice:false });
      photoURLs[id] = URL.createObjectURL(file);
      save();
      return { photoId:id, info:info };
    });
  });
}

function cropOf(pg){ return pg.crop || fullCrop(); }

function drawCanvas(w, pg){
  var cr = cropOf(pg);
  var box = el("div","skwrap");
  var inner = el("div","skinner");
  inner.style.width = (zoom * 100) + "%";

  var clip = el("div","skclip");
  /* the clip box keeps the cropped region's own shape */
  if(pg.natW && pg.natH){
    clip.style.paddingBottom = ((pg.natH * cr.h) / (pg.natW * cr.w) * 100) + "%";
  } else {
    clip.style.paddingBottom = "75%";
  }

  var img = document.createElement("img");
  img.className = "skimg abs"; img.alt = "Building sketch";
  img.style.width = (100 / cr.w) + "%";
  img.style.left = (-cr.x / cr.w * 100) + "%";
  img.style.top  = (-cr.y / cr.h * 100) + "%";
  photoURL(pg.photoId).then(function(u){ img.src = u; });
  clip.appendChild(img);

  J.pins.filter(function(pn){ return pn.page === pg.id; }).forEach(function(pn){
    var found = roomById(pn.roomId);
    if(!found) return;
    var R = found.R;
    var lx = (pn.x - cr.x) / cr.w, ly = (pn.y - cr.y) / cr.h;
    var pin = el("button","pin " + roomCls(R) + (arrangeMode ? " arrange" : ""));
    pin.type = "button";
    pin.appendChild(el("span", null, roomName(R, found.L)));
    var np = photosFor("room:" + R.id).length;
    pin.appendChild(el("span","pc", np ? String(np) : "▣"));
    pin.style.left = (lx * 100) + "%";
    pin.style.top  = (ly * 100) + "%";
    if(lx < -0.02 || lx > 1.02 || ly < -0.02 || ly > 1.02) pin.style.opacity = ".35";
    if(arrangeMode) attachDrag(pin, pn, clip, cr);
    else pin.onclick = function(ev){
      ev.stopPropagation();
      openRoom = pn.roomId; pendingPin = null; render(); $("pane").scrollTop = 0;
    };
    clip.appendChild(pin);
  });

  if(pendingPin && pendingPin.page === pg.id){
    var ghost = el("div","pin pending","?");
    ghost.style.left = ((pendingPin.x - cr.x) / cr.w * 100) + "%";
    ghost.style.top  = ((pendingPin.y - cr.y) / cr.h * 100) + "%";
    clip.appendChild(ghost);
  }

  clip.onclick = function(ev){
    if(arrangeMode) return;
    if(ev.target !== clip && ev.target !== img) return;
    var rect = clip.getBoundingClientRect();

    if(placingRoom){
      var found2 = roomById(placingRoom);
      if(found2){
        J.pins = J.pins.filter(function(x){ return x.roomId !== placingRoom; });
        J.pins.push({ id:uid(), roomId:placingRoom, page:pg.id,
          x: cr.x + ((ev.clientX - rect.left) / rect.width) * cr.w,
          y: cr.y + ((ev.clientY - rect.top) / rect.height) * cr.h });
        var nm3 = roomName(found2.R, found2.L);
        placingRoom = null;
        var keep3 = $("pane").scrollTop;
        save(); render();
        $("pane").scrollTop = keep3;
        toast(nm3 + " pinned.");
      } else { placingRoom = null; render(); }
      return;
    }

    pendingPin = {
      page: pg.id,
      x: cr.x + ((ev.clientX - rect.left) / rect.width) * cr.w,
      y: cr.y + ((ev.clientY - rect.top) / rect.height) * cr.h,
      level: J.levels.length ? (J.levels[0].name || "Level 1") : ""
    };
    render();
  };

  inner.appendChild(clip);
  box.appendChild(inner);
  w.appendChild(box);
}

function drawCropEditor(w, pg){
  var b = el("div","banner info");
  b.appendChild(el("div","bi","✂"));
  b.appendChild(el("div", null, "Drag a box around the part you want to work from, then tap "
    + "Use this area.  Pinning rooms comes after this step.  "
    + "If every level is drawn on this one page, crop to one level now and add the same "
    + "screenshot again for the next one."));
  w.appendChild(b);

  var box = el("div","skwrap");
  var inner = el("div","skinner cropstage");
  var img = document.createElement("img");
  img.className = "skimg"; img.alt = "Building sketch, uncropped";
  photoURL(pg.photoId).then(function(u){ img.src = u; });
  inner.appendChild(img);

  var sel = el("div","cropsel");
  var d = cropDraft || fullCrop();
  function paint(){
    sel.style.left = (d.x * 100) + "%";
    sel.style.top = (d.y * 100) + "%";
    sel.style.width = (d.w * 100) + "%";
    sel.style.height = (d.h * 100) + "%";
  }
  paint();
  inner.appendChild(sel);

  var start = null;
  inner.addEventListener("pointerdown", function(ev){
    var rect = inner.getBoundingClientRect();
    start = { x:(ev.clientX-rect.left)/rect.width, y:(ev.clientY-rect.top)/rect.height };
    try{ inner.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  inner.addEventListener("pointermove", function(ev){
    if(!start) return;
    var rect = inner.getBoundingClientRect();
    var cx = Math.min(1, Math.max(0, (ev.clientX-rect.left)/rect.width));
    var cy = Math.min(1, Math.max(0, (ev.clientY-rect.top)/rect.height));
    d.x = Math.min(start.x, cx); d.y = Math.min(start.y, cy);
    d.w = Math.abs(cx - start.x); d.h = Math.abs(cy - start.y);
    paint();
    ev.preventDefault();
  });
  inner.addEventListener("pointerup", function(ev){
    if(!start) return;
    start = null;
    try{ inner.releasePointerCapture(ev.pointerId); }catch(e){}
    cropDraft = d;
  });

  box.appendChild(inner);
  w.appendChild(box);

  var row = el("div","skbar");
  var ok = el("button","nav","Use this area"); ok.type = "button";
  ok.onclick = function(){
    if(cropDraft && cropDraft.w > 0.04 && cropDraft.h > 0.04) pg.crop = cropDraft;
    cropMode = null; cropDraft = null; save(); render();
  };
  var whole = el("button","ghost","Use the whole page"); whole.type = "button";
  whole.onclick = function(){
    pg.crop = fullCrop(); cropMode = null; cropDraft = null; save(); render();
  };
  var cancel = el("button","ghost","Cancel"); cancel.type = "button";
  cancel.onclick = function(){ cropMode = null; cropDraft = null; render(); };
  row.appendChild(ok); row.appendChild(whole); row.appendChild(cancel);
  w.appendChild(row);
}

function attachDrag(pin, pn, inner, cr){
  var dragging = false;
  pin.onclick = function(ev){ ev.stopPropagation(); ev.preventDefault(); };
  pin.addEventListener("pointerdown", function(ev){
    dragging = true;
    try{ pin.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault(); ev.stopPropagation();
  });
  pin.addEventListener("pointermove", function(ev){
    if(!dragging) return;
    var rect = inner.getBoundingClientRect();
    var x = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    var y = Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height));
    pn.x = cr.x + x * cr.w; pn.y = cr.y + y * cr.h;
    pin.style.left = (x*100) + "%"; pin.style.top = (y*100) + "%";
    ev.preventDefault();
  });
  pin.addEventListener("pointerup", function(ev){
    if(!dragging) return;
    dragging = false;
    try{ pin.releasePointerCapture(ev.pointerId); }catch(e){}
    save();
  });
}

function placePin(type, lvl){
  if(!lvl){
    J.levels.push(newLevel(0));
    lvl = J.levels[0];
  }
  var R = newRoom(type, lvl);
  lvl.rooms.push(R);
  J.pins.push({ id:uid(), roomId:R.id, page:pendingPin.page, x:pendingPin.x, y:pendingPin.y });
  pendingPin = null;
  /* stay on the sketch: label the whole floor first, walk it afterwards */
  var keep = $("pane").scrollTop;
  save(); render();
  $("pane").scrollTop = keep;
  toast(roomName(R, lvl) + " pinned.  Keep going, then tap a pin when you are in that room.");
}

function stBoard(){
  var rooms = allRooms();
  if(!rooms.length) return st(0, 1);
  var done = rooms.filter(function(x){ return roomDone(x.R); }).length;
  var bad = rooms.some(function(x){ return roomBad(x.R); });
  var s2 = st(done, rooms.length);
  if(bad) s2.cls = "bad";
  return s2;
}

/* ---- phase 5 the walk ---- */
function roomDone(R){
  var need = has(R.type) && R.flooring.length > 0 && has(R.ceilingHeight) && photosFor("room:"+R.id).length > 0;
  if(E.kbTypes.indexOf(R.type) >= 0){
    need = need && has(R.update) && has(R.cond)
      && (R.update === "Not Updated" || has(R.time));
  }
  return need;
}
function roomTouched(R){
  return R.flooring.length > 0 || has(R.ceilingHeight) || R.ceilingStyles.length > 0
    || has(R.update) || has(R.cond) || has(R.windows) || has(R.note)
    || R.defects.length > 0 || photosFor("room:"+R.id).length > 0;
}
/* Red is reserved for a real problem: a room worked on but left without its
   photo, or a defect logged without one.  A room not reached yet is grey. */
function roomBad(R){
  if(roomTouched(R) && photosFor("room:"+R.id).length === 0) return true;
  return R.defects.some(function(D){ return photosFor("def:"+D.id).length === 0; });
}
function drawRoom(w, R, L){

  var isBath = R.type === "Bath – Full" || R.type === "Bath – Half";

  var f = field(w, {label:"Photos of this room", req:"REQUIRED",
    hint:"The SOP says every single room gets photographed, and the form requires a photo of every kitchen and bathroom."});
  photoBlock(f, "room:"+R.id, roomName(R, L), true, "Required");

  f = field(w, {label:"Level", id:"10.029", req:"REQUIRED",
    hint:"Tap a different level to move the room there.  Everything lands on Level 1 until you say otherwise."});
  var lvNames = J.levels.map(function(Lv){ return Lv.name || "Level"; });
  tilesOne(f, lvNames, function(){ return L.name; }, function(v){

    var dest = J.levels.filter(function(Lv){ return (Lv.name || "Level") === v; })[0];

  }, null, true);
  var addLv = el("button","ghost","+  Add a level"); addLv.type = "button";
  addLv.style.marginTop = "8px";
  addLv.onclick = function(){
    var nl = newLevel(J.levels.length);
    J.levels.push(nl);
    var ix4 = L.rooms.indexOf(R);
    if(ix4 >= 0) L.rooms.splice(ix4, 1);
    nl.rooms.push(R);
    save(); render(); $("pane").scrollTop = 0;
    toast(roomName(R, nl) + " moved to " + nl.name + ".  Set its grade and areas on Levels and area.");
  };
  f.appendChild(addLv);

  var myPin = pinFor(R.id);
  f = field(w, {label:"On the sketch", req:"optional"});
  if(myPin){
    var pg2 = J.sketchPages.filter(function(x){ return x.id === myPin.page; })[0];
    f.appendChild(el("div","hint","Pinned on " + (pg2 ? pg2.name : "the sketch") + "."));
    var rp = el("button","ghost","Move the pin"); rp.type = "button";
    rp.onclick = function(){
      placingRoom = R.id; openRoom = null; screenIx = boardIx();
      if(pg2) boardPage = J.sketchPages.indexOf(pg2);
      render(); $("pane").scrollTop = 0;
    };
    f.appendChild(rp);
  } else if(J.sketchPages.length){
    f.appendChild(el("div","hint","This room has no pin yet."));
    var pnb = el("button","add","+  Pin this room on the sketch"); pnb.type = "button";
    pnb.onclick = function(){
      placingRoom = R.id; openRoom = null; screenIx = boardIx();
      render(); $("pane").scrollTop = 0;
    };
    f.appendChild(pnb);
  } else {
    f.appendChild(el("div","hint","No sketch added yet, so there is nothing to pin to."));
  }

  f = field(w, {label:"Room label", req:"optional", hint:"Only if you want something other than " + roomName(R, L) + "."});
  var nb = el("div","narrow"); f.appendChild(nb);
  textIn(nb, function(){ return R.label; }, function(v){ R.label = v; }, roomName(R, L));

  w.appendChild(el("h2", null, "Flooring"));
  f = field(w, {label:"Flooring in this room", id:"10.045", req:"REQUIRED",
    hint:"Pick every type present.  These roll up into the unit flooring table."});
  tilesMany(f, E.flooringType, R.flooring, null, null, true, commonFor("flooringType"));

function drawDefectCard(w, D, i, R, L){
  var missPhoto = photosFor("def:"+D.id).length === 0;
  var c = el("div","card" + (missPhoto ? " flag" : ""));
  var h = el("div","cardhead");
  h.appendChild(el("div","cardtitle","Deficiency " + (i+1) + (D.feature ? "  ·  " + D.feature : "")));
  var del = el("button","ghost danger","Remove"); del.type = "button";
  del.onclick = function(){
    photosFor("def:"+D.id).forEach(function(p){ deletePhoto(p.id); });
    R.defects.splice(i,1); save(); render();
  };
  h.appendChild(del); c.appendChild(h);

  var loc = defectLocationFor(R, L);
  var lb = el("div","banner info");
  lb.appendChild(el("div","bi","→"));
  lb.appendChild(el("div", null, "Location will report as " + loc.loc
    + (loc.other ? " — " + loc.other : "") + "  (10.057)."));
  c.appendChild(lb);

  var f = field(c, {label:"Feature", id:"10.056", req:"REQUIRED"});
  tilesOne(f, E.defectFeature, function(){ return D.feature; }, function(v){ D.feature = v; }, null, true);
  if(D.feature === "Other (Describe)"){
    var f1 = field(c, {label:"Other feature, described", id:"10.056", req:"REQUIRED"});
    textIn(f1, function(){ return D.featureOther; }, function(v){ D.featureOther = v; }, "cabinetry, fixture, subfloor");
  }

  f = field(c, {label:"Description", id:"10.058", req:"REQUIRED",
    hint:"What you saw, in plain words.  Say what it appears to indicate rather than naming a cause."});
  memo(f, function(){ return D.desc; }, function(v){ D.desc = v; }, "Describe the deficiency");

  f = field(c, {label:"Affects soundness or structural integrity", id:"10.059", req:"REQUIRED"});
  yesNo(f, function(){ return D.affects; }, function(v){ D.affects = v; });

  f = field(c, {label:"Recommended action", id:"10.060", req:"REQUIRED"});
  tilesOne(f, E.recAction, function(){ return D.action; }, function(v){ D.action = v; }, E.recActionDef, true);

  if(D.action === "Repair"){
    var f4 = field(c, {label:"Estimated cost to cure", req:"optional",
      hint:"Not a field here.  It carries to the Reconciliation section if you want it there."});
    var nb2 = el("div","narrow"); f4.appendChild(nb2);
    textIn(nb2, function(){ return D.cost; }, function(v){ D.cost = v; }, "$", "number");
  }

  f = field(c, {label:"Photo of this deficiency", req:"REQUIRED",
    hint:"The form requires a photo or image for every physical defect."});
  photoBlock(f, "def:"+D.id, (D.feature || "Defect") + " – " + roomName(R, L), true, "Required");

  w.appendChild(c);
}

function stRoll(){
  if(!allRooms().length) return st(0, 1);
  var n = 0, tot = 5;
  var fl = derivedFlooring();
  if(fl.length && fl.every(function(F){ return has(J.rollup.flooringCond[F.type] || F.worst); })) n++;
  if(has(J.rollup["10.049"])) n++;
  if(finalCeilingHeights().length && finalCeilingStyles().length && has(J.rollup.wallsCondition)) n++;
  if(has(J.rollup["10.043"] || suggestBathOverall())) n++;
  if(J.rollup["10.050"].length) n++;
  return st(n, tot);
}

  if(has(M["9.007"])) n++;
  if(has(M["9.010"]) && (M["9.010"] === "No" || (has(M["9.014"]) && has(M["9.015"])))) n++;
  if(has(M["9.016"]) && has(M["9.017"])) n++;
  if(!has(M["9.018"]) || (has(M["9.019"]) && photosFor("mh:program").length)) n++;

/* Jump from a line on the review screen to the control that fixes it. */
function goFix(g){
  var t = g && g.go;
  if(!t){ toast("That one has no home screen yet — tell Kenneth."); return; }
  var ix = SCREENS.map(function(S){ return S.key; }).indexOf(t.screen);
  if(ix < 0) return;
  screenIx = ix;
  openRoom = (t.room && roomById(t.room)) ? t.room : null;
  showJobs = false;
  placingRoom = null;
  render();
  $("pane").scrollTop = 0;
  setTimeout(function(){ scrollToField(g, t); }, 30);
}

/* Find the control a gap came from and put it in front of him.  Matches on the
   UAD field id first, then on the field label, and otherwise leaves the screen
   at the top rather than scrolling somewhere wrong. */
function scrollToField(g, t){
  var wrap = $("wrap"), target = null;
  if(g.id){
    var byId = wrap.querySelectorAll('[data-fid="' + g.id + '"]');
    if(byId.length) target = byId[Math.min(t.nth || 0, byId.length - 1)];
  }
  if(!target && g.what){
    var all = wrap.querySelectorAll("[data-lbl]");
    var want = g.what.toLowerCase();
    for(var i = 0; i < all.length; i++){
      var lbl = (all[i].getAttribute("data-lbl") || "").toLowerCase();
      if(!lbl) continue;
      if(want === lbl || want.indexOf(lbl) >= 0 || lbl.indexOf(want) >= 0){ target = all[i]; break; }
    }
  }
  if(!target) return;
  try{ target.scrollIntoView({ block:"center" }); }
  catch(e){ $("pane").scrollTop = target.offsetTop - 80; }
  target.classList.add("findme");
  setTimeout(function(){ target.classList.remove("findme"); }, 2400);
}

    if(u === "Sanitary Sewer" && U2.own === "Non-Public"){
      need(U2.sewer.length > 0, "Sewer system type", "4.084");
      need(has(U2.comment), "Septic comment", "4.086");
    }
    if(u === "Electricity" && U2.own === "Non-Public")
      need(U2.elec.length > 0, "Electricity source", "4.072");
  });
  _gt = { screen:"site" };
  need(has(S4.water), "Does the property front water");
  if(S4.water === "Yes"){
    need(has(S4["4.031"]), "Water frontage linear measurement", "4.031");
    need(has(S4["4.037"]), "Water access depth", "4.037");
    need(has(S4["4.033"]), "Right to build a permanent feature", "4.033");
  }
  _gt = { screen:"site" };
  need(has(S4["4.017"]), "Non-residential use on the property", "4.017");
  if(S4["4.017"] === "Yes"){
    need(has(S4["4.015"]), "Is it still primarily residential", "4.015");
    need(has(S4["4.043_other"]), "What the non-residential use is", "4.043");
    need(has(S4["4.018"]), "Non-residential modifications", "4.018");
  }
  need(S4["4.047"].length > 0, "Hazard zones", "4.047");
  if(S4["4.047"].length && S4["4.047"].indexOf("None (No Hazard Zone Noted)") < 0)
    need(has(S4["4.048"]), "Hazard zone impact", "4.048");
  S4.defects.forEach(function(D, di){
    _gt = { screen:"site", nth:di };
    var dn = "Site defect " + (di+1);

    need(has(D.desc), dn + " description", "4.102");
    need(has(D.affects), dn + " affects soundness", "4.103");
    need(has(D.action), dn + " recommended action", "4.104");
    need(photosFor("sitedef:"+D.id).length > 0, dn + " photo", "", true);
  });

  if(isManufactured()){
    _gt = { screen:"mh" };
    var M = J.mh;
    need(has(M["9.000"]), "Manufacturer", "9.000");
    need(has(M["9.001"]), "Year installed", "9.001");
    need(has(M["9.001_est"]), "Year installed estimated, yes or no", "9.001");

    if(M["9.006"] === "Yes"){
      need(M.skirting.length > 0, "Skirting material", "9.006");
      need(photosFor("mh:skirting").length > 0, "Photo of the skirting", "9.006", true);
    }
    need(has(M["9.007"]), "Structural modifications exist", "9.007");
    if(M["9.007"] === "Yes"){

    }

    if(M["9.010"] === "Yes"){

  need(has(J.ask["6.000"]), "Renewable energy components, yes or no", "6.000");
  need(has(J.ask["6.004"]), "Building certifications, yes or no", "6.004");
  need(has(J.ask["6.010"]), "Green efficiency ratings, yes or no", "6.010");
  J.ask.renew.forEach(function(Rn, i){

  J.ask.certs.forEach(function(C2, i){
    need(has(C2.org), "Certification " + (i+1) + " organization", "6.005");
    need(has(C2.name), "Certification " + (i+1) + " name", "6.006");
  });
  J.ask.ratings.forEach(function(Rt, i){
    need(has(Rt.org), "Efficiency rating " + (i+1) + " organization", "6.011");
    need(has(Rt.name), "Efficiency rating " + (i+1) + " name", "6.012");
    need(has(Rt.score), "Efficiency rating " + (i+1) + " score", "6.013");
  });
  if(J.ask["6.000"] === "Yes" || J.ask["6.004"] === "Yes" || J.ask["6.010"] === "Yes")
    need(has(J.ask["6.014"]), "Impact of the green features on value", "6.014");

  _gt = { screen:"extdata" };
  need(has(J.ext["8.046"]), "Noncontinuous finished area, yes or no", "8.046");
  if(J.ext["8.046"] === "Yes"){
    need(has(J.ext["8.047"]), "Noncontinuous finished area total", "8.047");
    need((J.ext.ncRooms || []).some(function(r){ return r.n > 0; }),

  _gt = { screen:"board" };
  if(num(J.meta.adus) > 0) allRooms().forEach(function(x){
    var A2 = x.R.adu || {};

  _gt = { screen:"out" };
  J.outbuildings.forEach(function(O, i){

  _gt = { screen:"overall" };

  need(has(J.overall["15.005"]), "Overall condition rating", "15.005");
  need(has(J.overall["15.010"]), "Reconciliation of overall quality and condition", "15.010");

  _gt = { screen:"qc" };
  need(has(J["10.034"]), "Interior quality rating", "10.034");
  need(has(J["10.035"]), "Interior condition rating", "10.035");
  return g;

/* ---------------------------------------------------- store-only zip */

var CRC_TABLE = (function(){
  var t = new Uint32Array(256), c, n, k;
  for(n=0;n<256;n++){ c = n; for(k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(u8){
  var c = 0xFFFFFFFF, i;
  for(i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosTime(d){ return ((d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds()/2)) & 0xFFFF; }
function dosDate(d){ return (((d.getFullYear() - 1980) << 9) | ((d.getMonth()+1) << 5) | d.getDate()) & 0xFFFF; }
function makeZip(entries){
  var now = new Date(), parts = [], central = [], offset = 0;
  entries.forEach(function(e){
    var nameU8 = new TextEncoder().encode(e.name);
    var crc = crc32(e.data), len = e.data.length;
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime(now), true); lh.setUint16(12, dosDate(now), true);
    lh.setUint32(14, crc, true); lh.setUint32(18, len, true); lh.setUint32(22, len, true);
    lh.setUint16(26, nameU8.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameU8, e.data);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime(now), true); ch.setUint16(14, dosDate(now), true);
    ch.setUint32(16, crc, true); ch.setUint32(20, len, true); ch.setUint32(24, len, true);
    ch.setUint16(28, nameU8.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameU8);
    offset += 30 + nameU8.length + len;
  });
  var cdSize = central.reduce(function(a, u){ return a + u.length; }, 0);
  var end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  end.setUint16(20, 0, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type:"application/zip" });
}
function slug(s){
  return (s || "inspection").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "inspection";
}
function sendPackage(btn){
  btn.disabled = true;
  var label = btn.textContent;
  btn.textContent = "Building the package…";
  var enc = new TextEncoder();
  var entries = [
    { name:"inspection.json", data:enc.encode(JSON.stringify(buildPayload(), null, 1)) },
    { name:"FIELD SHEET.txt", data:enc.encode(buildSummary()) }
  ];
  var chain = Promise.resolve();
  J.photos.forEach(function(p){
    chain = chain.then(function(){
      return idbGet("photo:"+p.id).then(function(b){
        if(!b) return;
        return b.arrayBuffer().then(function(ab){
          entries.push({ name:"photos/" + p.id + ".jpg", data:new Uint8Array(ab) });
        });
      });
    });
  });
  chain.then(function(){
    var zip = makeZip(entries);
    var fname = slug(J.meta.address) + "-field-" + (J.meta.inspDate || todayISO()) + ".zip";
    var file = null;
    try{ file = new File([zip], fname, { type:"application/zip" }); }catch(e){}
    btn.textContent = label; btn.disabled = false;
    if(file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
      navigator.share({ files:[file], title:fname }).catch(function(){ fallbackSave(zip, fname); });
      return;
    }
    fallbackSave(zip, fname);
  }).catch(function(err){
    console.error(err);
    btn.textContent = label; btn.disabled = false;
    toast("Could not build the package.  " + (err && err.message ? err.message : ""));
  });
}
function fallbackSave(blob, fname){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = fname; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 20000);
  toast("Saving " + fname + ".  If nothing happened, this device is blocking the save — use the text button and paste it instead.");
}
function toast(msg){
  var t = $("toast");
  if(!t){
    t = el("div", null); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));"
      + "max-width:min(620px,92vw);background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:12px;"
      + "font-size:14px;line-height:1.4;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.28)";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  clearTimeout(t._h);
  t._h = setTimeout(function(){ if(t && t.parentNode) t.remove(); }, 7000);
}

function drawJobs(w){
  w.appendChild(el("h1", null, "Field sheets on this iPad"));
  w.appendChild(el("p","sub","Everything lives on this device only.  Nothing is uploaded anywhere.  Send the package to the job folder when you leave the property."));

  if(!JOBS.length) w.appendChild(el("div","empty","No field sheets yet."));
  var list = el("div","joblist");
  JOBS.slice().sort(function(a,b){ return b.updated - a.updated; }).forEach(function(j){
    var b = el("button","jobcard"); b.type = "button";
    var a = el("div","ja");
    a.appendChild(el("div","jt", j.address || "(no address yet)"));
    a.appendChild(el("div","jm", (j.date || "") + (j.client ? "   ·   " + j.client : "")
      + "   ·   saved " + new Date(j.updated).toLocaleDateString()));
    b.appendChild(a);
    b.appendChild(el("div","fid", J && J.id === j.id ? "OPEN NOW" : "OPEN"));
    b.onclick = function(){ loadJob(j.id); };
    list.appendChild(b);
  });
  w.appendChild(list);

  var nb = el("button","big","Start a new field sheet"); nb.type = "button";
  nb.onclick = function(){
    var j = blankJob();
    j.levels.push(newLevel(0));
    JOBS.push({ id:j.id, address:"", client:"", date:j.meta.inspDate, updated:j.updated });
    J = j; screenIx = 0; showJobs = false; openRoom = null;
    idbPut("job:"+j.id, j).then(function(){ return idbPut("jobs", JOBS); }).then(render);
  };
  w.appendChild(nb);

  if(J){
    var del = el("button","big sec","Delete the sheet that is open");
    del.type = "button"; del.style.marginTop = "10px";
    del.onclick = function(){
      if(!confirm("Delete the field sheet for " + (J.meta.address || "this property")
        + " and all " + J.photos.length + " of its photos?  This cannot be undone.")) return;
      var id = J.id;
      J.photos.forEach(function(p){ idbDel("photo:"+p.id); });
      JOBS = JOBS.filter(function(x){ return x.id !== id; });
      idbDel("job:"+id).then(function(){ return idbPut("jobs", JOBS); }).then(function(){
        J = null; showJobs = true; openRoom = null; render();
      });
    };
    w.appendChild(del);
  }
}
function upgrade(j){
  var b = blankJob();
  Object.keys(b).forEach(function(k){ if(!(k in j)) j[k] = b[k]; });
  Object.keys(b.meta).forEach(function(k){ if(!(k in j.meta)) j.meta[k] = b.meta[k]; });
  Object.keys(b.sketch).forEach(function(k){ if(!(k in j.sketch)) j.sketch[k] = b.sketch[k]; });
  Object.keys(b.rollup).forEach(function(k){ if(!(k in j.rollup)) j.rollup[k] = b.rollup[k]; });
  if(!j.ext) j.ext = b.ext;
  if(!j.vehicle) j.vehicle = b.vehicle;
  ["ask","func","overall","site","mh"].forEach(function(k){
    if(!j[k]) j[k] = b[k];
    Object.keys(b[k]).forEach(function(k2){ if(!(k2 in j[k])) j[k][k2] = b[k][k2]; });
  });
  (j.outbuildings || []).forEach(function(O){ if(!O.rooms) O.rooms = []; });
  Object.keys(b.vehicle).forEach(function(k){ if(!(k in j.vehicle)) j.vehicle[k] = b.vehicle[k]; });
  if(!j.amenityDefects) j.amenityDefects = [];
  (j.photos || []).forEach(function(ph){ if(!("onDevice" in ph)) ph.onDevice = false; });
  /* the first build stored outbuildings and amenities as {what, note} only */
  (j.outbuildings || []).forEach(function(O){
    var nb = newOutbuilding();
    Object.keys(nb).forEach(function(k){ if(!(k in O)) O[k] = nb[k]; });
    if(!has(O.typeOther) && has(O.what)) O.typeOther = O.what;
  });
  (j.amenities || []).forEach(function(A){
    var na = newAmenity();
    Object.keys(na).forEach(function(k){ if(!(k in A)) A[k] = na[k]; });
    if(!has(A.typeOther) && has(A.what)) A.typeOther = A.what;
  });
  Object.keys(b.ext).forEach(function(k){
    if(!(k in j.ext)){ j.ext[k] = b.ext[k]; return; }
    var bv = b.ext[k];
    if(bv && typeof bv === 'object' && !Array.isArray(bv)){
      Object.keys(bv).forEach(function(k2){ if(!(k2 in j.ext[k])) j.ext[k][k2] = bv[k2]; });
    }
  });
  (j.levels || []).forEach(function(L){
    (L.rooms || []).forEach(function(R){
      var nr = newRoom(R.type || "", L);
      Object.keys(nr).forEach(function(k){ if(!(k in R)) R[k] = nr[k]; });
    });
  });
  return j;
}
