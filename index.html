function render(){
  var rail = $("rail"), strip = $("strip"), wrap = $("wrap");
  rail.textContent = ""; strip.textContent = ""; wrap.textContent = "";

  $("jobline").textContent = J ? (J.meta.address || "New field sheet") : "No sheet open";
  $("jobsbtn").textContent = showJobs ? "Close" : "Files";
  $("skbtn").textContent = (J && screenIx === boardIx() && openRoom) ? "All rooms" : "Sketch";
  $("skbtn").disabled = !J;

  if(showJobs || !J){
    drawJobs(wrap);
    $("prev").disabled = true; $("next").disabled = true;
    $("statusline").textContent = JOBS.length + " sheet" + (JOBS.length===1?"":"s") + " on this device";
    return;
  }

  var lastPhase = "";
  SCREENS.forEach(function(S, i){
    if(S.phase !== lastPhase){
      rail.appendChild(el("div","railhead", S.phase));
      lastPhase = S.phase;
    }
    var s = S.status();
    var b = el("button","step"); b.type = "button";
    b.setAttribute("aria-current", i === screenIx ? "true" : "false");
    b.appendChild(el("span","n", String(i+1)));
    b.appendChild(el("span","lbl", S.label));
    b.appendChild(el("span","dot " + s.cls));
    b.onclick = function(){ screenIx = i; openRoom = null; render(); $("pane").scrollTop = 0; };
    rail.appendChild(b);

    var c = el("button","schip"); c.type = "button";
    c.setAttribute("aria-current", i === screenIx ? "true" : "false");
    c.appendChild(el("span", null, S.label));
    c.appendChild(el("span","dot " + s.cls));
    c.onclick = function(){ screenIx = i; openRoom = null; render(); $("pane").scrollTop = 0; };
    strip.appendChild(c);
  });

  SCREENS[screenIx].draw(wrap);

  $("prev").disabled = screenIx === 0;
  $("next").disabled = screenIx === SCREENS.length - 1;
  touchStatus();
}
function touchStatus(){
  if(!J) return;
  var s = SCREENS[screenIx].status();
  var g = findGaps();
  var hard = g.filter(function(x){ return x.hard; }).length;
  var un = unsavedPhotos().length;
  var sl = $("statusline");
  sl.textContent = SCREENS[screenIx].label + " · " + s.txt
    + "   —   " + g.length + " open" + (hard ? ", " + hard + " photos" : "");
  var badge = $("backup");
  if(un){
    badge.textContent = un + " photo" + (un===1?"":"s") + " not backed up";
    badge.className = "backup warn";
    badge.hidden = false;
  } else if(J.photos.length){
    badge.textContent = "All " + J.photos.length + " backed up";
    badge.className = "backup ok";
    badge.hidden = false;
  } else {
    badge.hidden = true;
  }
}

$("prev").onclick = function(){

};

function selfCheck(){
  var needed = ["fullCrop","sketchBox","storeSketch","storePhoto","photoBlock",
    "addSketchButton","drawCanvas","drawCropEditor","cropOf","attachDrag",
    "roomById","pinFor","placePin","drawRoomList","drawRoom","drawDefectCard",
    "roomDone","roomBad","roomTouched","roomCls","allRooms","roomName","roomCounts",
    "derivedFlooring","finalCeilingHeights","finalCeilingStyles","suggestBathOverall",
    "allDefects","defectLocationFor","subjectTo","extDefectsSubjectTo","shotList",
    "newRoom","newDefect","newExtDefect","newLevel","newOutbuilding","newAmenity",
    "newSimpleDefect","obName","amName","drawSimpleDefect","commonFor","splitCommon",
    "tunableLists","quickWords","restBlock","makeZip","buildPayload","buildSummary",
    "findGaps","sendPackage","toast","upgrade"];
  var missing = needed.filter(function(n){ return typeof window[n] !== "function"; });
  var screens = SCREENS.filter(function(S){
    return typeof S.draw !== "function" || typeof S.status !== "function";
  }).map(function(S){ return S.key; });

}

    var b0 = el("div","banner stop");
    b0.appendChild(el("div","bi","▲"));
    b0.appendChild(el("div", null, "This build is broken and should not be used on a file.  "
      + (chk.missing.length ? "Missing: " + chk.missing.join(", ") + ".  " : "")
      + (chk.screens.length ? "Broken screens: " + chk.screens.join(", ") + "." : "")
      + "  Tell Kenneth exactly this."));
    w0.appendChild(b0);
    console.error("selfCheck", chk);
  }
})();

(function boot(){
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  openDB().then(function(d){
    db = d;
    return idbGet("prefs");
  }).then(function(pf){
    if(pf && pf.common) PREFS = pf;
    return idbGet("jobs");
  }).then(function(list){
    JOBS = list || [];
    var last = JOBS.slice().sort(function(a,b){ return b.updated - a.updated; })[0];
    return last ? idbGet("job:"+last.id) : null;
  }).then(function(j){
    if(j){
      J = upgrade(j);
      screenIx = (J.sketchPages.length || allRooms().length) ? boardIx() : 0;
      $("saved").textContent = "Saved " + new Date(J.updated).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    } else {
      showJobs = true;
    }
    render();
  }).catch(function(err){
    console.error(err);
    var wrap = $("wrap");
    wrap.textContent = "";
    var b = el("div","banner stop");
    b.appendChild(el("div","bi","▲"));
    b.appendChild(el("div", null, "This device will not let the sheet save.  Private browsing blocks storage — open the app from the home screen icon instead, then reload."));
    wrap.appendChild(b);
  });
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
